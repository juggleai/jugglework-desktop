minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@opencode-ai/sdk"
  # Security-only exceptions. These versions patch active Dependabot alerts
  # and should not wait for the normal three-day release cooling period.
  - "fast-uri@3.1.5"
  - "ip-address@10.3.1"
  - "postcss@8.5.23"
  - "socket.io-parser@4.2.7"
  - "undici@6.28.0"

packages:
  - "apps/*"
  - "packages/*"

catalog:
  react: 19.2.4
  react-dom: 19.2.4

catalogs:
  react18:
    react: 18.2.0
    react-dom: 18.2.0
linkWorkspacePackages: true
preferWorkspacePackages: true
overrides:
  fast-uri: 3.1.5
  ip-address: 10.3.1
  postcss: 8.5.23
  socket.io-parser: 4.2.7
  undici@6: 6.28.0
allowBuilds:
  "@sentry/cli": true
  "@whiskeysockets/baileys": true
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  msw: false
  node-pty: true
  protobufjs: true
  sharp: true
patchedDependencies:
  '@modelcontextprotocol/sdk': patches/@modelcontextprotocol__sdk.patch
