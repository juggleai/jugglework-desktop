services:
  jugglework-host:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Keep this in sync with apps/orchestrator/package.json if you want a pinned release.
        JUGGLEWORK_ORCHESTRATOR_VERSION: 0.11.22
    ports:
      - "8787:8787"
    environment:
      # Set these explicitly for stable sharing.
      # JUGGLEWORK_TOKEN: "..."
      # JUGGLEWORK_HOST_TOKEN: "..."
      # Optional: JUGGLEWORK_APPROVAL_MODE: "auto"
      # Optional: JUGGLEWORK_APPROVAL_TIMEOUT_MS: "30000"
      JUGGLEWORK_DATA_DIR: /data/jugglework-orchestrator
      JUGGLEWORK_SIDECAR_DIR: /data/sidecars
    volumes:
      # Mount an existing project/workspace here.
      - ./workspace:/workspace
      # Persistent host data (OpenCode caches, server config, tokens).
      - ./data:/data
