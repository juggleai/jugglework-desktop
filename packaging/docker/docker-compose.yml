services:
  jugglework-host:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Keep these in sync with apps/server/package.json and constants.json.
        JUGGLEWORK_SERVER_VERSION: 1.1.30
        OPENCODE_VERSION: 1.18.15
    ports:
      - "8787:8787"
    environment:
      # Set these explicitly for stable sharing.
      # JUGGLEWORK_TOKEN: "..."
      # JUGGLEWORK_HOST_TOKEN: "..."
      # Optional: JUGGLEWORK_APPROVAL_MODE: "auto"
      # Optional: JUGGLEWORK_APPROVAL_TIMEOUT_MS: "30000"
      JUGGLEWORK_DATA_DIR: /data/jugglework-server
      JUGGLEWORK_SIDECAR_DIR: /data/sidecars
    volumes:
      # Mount an existing project/workspace here.
      - ./workspace:/workspace
      # Persistent host data (OpenCode caches, server config, tokens).
      - ./data:/data
