name: Build Electron Desktop

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target"
        required: true
        type: choice
        default: all
        options:
          - all
          - windows-arm64-installer
          - windows-x64-installer
  push:
    branches:
      - electron-notary-test
    paths:
      - apps/app/**
      - apps/desktop/**
      - apps/server/**
      - modules/toonflowV2/**
      - packages/**
      - patches/**
      - constants.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .github/workflows/build-electron-desktop.yml

jobs:
  build-electron:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos
          - os: macos-15-intel
            artifact: macos-x64
          - os: ubuntu-latest
            artifact: linux
            expected_arch: x64
            linux_unpacked_dir: linux-unpacked
          - os: windows-latest
            artifact: windows
          - os: windows-11-arm
            artifact: windows-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # pnpm must be installed BEFORE setup-node so setup-node can find the
      # pnpm binary on PATH. Matches the pattern in build-desktop.yml so
      # the two workflows share the same bootstrap story.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native source media tools and verify restricted editing
        env:
          MEDIA_TOOLS_SMOKE: "1"
        run: |
          node apps/desktop/scripts/buildMediaTools.mjs
          node --test apps/desktop/scripts/buildToonFactory.test.mjs

      - name: Package Electron desktop (unpacked)
        run: pnpm --filter @jugglework/desktop package:electron:dir

      - name: Verify packaged Linux Toon Factory bundle
        if: matrix.artifact == 'linux'
        run: pnpm --dir apps/desktop verify:linux-package -- --dir "dist-electron/${{ matrix.linux_unpacked_dir }}" --arch "${{ matrix.expected_arch }}"

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jugglework-electron-${{ matrix.artifact }}
          path: apps/desktop/dist-electron/**

  electron-macos-notarization-smoke:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all'
    name: Electron macOS notarization smoke
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write notary API key
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail

          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH"

          echo "NOTARY_KEY_PATH=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"

      - name: Package Electron desktop (signed + notarized, no publish)
        env:
          CSC_LINK: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
          MACOS_NOTARIZE: true
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ env.NOTARY_KEY_PATH }}
        run: |
          set -euo pipefail
          pnpm --filter @jugglework/desktop run build:electron
          pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --mac dmg zip --publish never

  build-windows-arm64-installer:
    name: Build Windows ARM64 installer
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'windows-arm64-installer'
    runs-on: windows-11-arm
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Enable git long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron application
        shell: bash
        env:
          TARGET: aarch64-pc-windows-msvc
        run: pnpm --filter @jugglework/desktop build:electron

      - name: Package Windows ARM64 installer
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/desktop exec electron-builder \
            --config electron-builder.yml \
            --win --arm64 \
            --publish never

      - name: Verify installer inventory
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/desktop/dist-electron/jugglework-win-arm64-*.exe
          test -f apps/desktop/dist-electron/jugglework-win-arm64-*.exe.blockmap
          test -f apps/desktop/dist-electron/latest.yml

      - name: Upload Windows ARM64 installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jugglework-electron-windows-arm64-installer
          path: |
            apps/desktop/dist-electron/jugglework-win-arm64-*.exe
            apps/desktop/dist-electron/jugglework-win-arm64-*.exe.blockmap
            apps/desktop/dist-electron/latest.yml
          if-no-files-found: error

  build-windows-x64-installer:
    name: Build Windows x64 installer
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'windows-x64-installer'
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Enable git long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron application
        shell: bash
        env:
          TARGET: x86_64-pc-windows-msvc
        run: pnpm --filter @jugglework/desktop build:electron

      - name: Package Windows x64 installer
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/desktop exec electron-builder \
            --config electron-builder.yml \
            --win --x64 \
            --publish never

      - name: Verify installer inventory
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/desktop/dist-electron/jugglework-win-x64-*.exe
          test -f apps/desktop/dist-electron/jugglework-win-x64-*.exe.blockmap
          test -f apps/desktop/dist-electron/latest.yml

      - name: Upload Windows x64 installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jugglework-electron-windows-x64-installer
          path: |
            apps/desktop/dist-electron/jugglework-win-x64-*.exe
            apps/desktop/dist-electron/jugglework-win-x64-*.exe.blockmap
            apps/desktop/dist-electron/latest.yml
          if-no-files-found: error
