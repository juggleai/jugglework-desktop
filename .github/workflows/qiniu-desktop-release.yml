name: Qiniu Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact release version (stable X.Y.Z; alpha may be prerelease)"
        required: true
        type: string
      channel:
        description: "Qiniu channel"
        required: true
        type: choice
        options:
          - stable
          - alpha
      platform:
        description: "Desktop release platform"
        required: true
        default: mac
        type: choice
        options:
          - mac
          - windows
      windows_publisher_names:
        description: "Windows Authenticode publisher name or JSON allowlist; defaults to the protected environment variable"
        required: false
        type: string
      promote:
        description: "Promote the mutable channel manifest after all gates"
        required: true
        default: false
        type: boolean
      canary_json:
        description: "Non-secret machine canary JSON; required when promote=true"
        required: false
        type: string

permissions:
  actions: read
  contents: read

# Never cancel a publisher after it may have acquired the bucket lock. The
# per-channel/platform group serializes every immutable upload and promotion attempt.
concurrency:
  group: qiniu-desktop-release-${{ inputs.channel }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  release-macos-arm64:
    name: Build, verify, and publish macOS arm64
    if: inputs.platform == 'mac'
    runs-on: macos-26
    timeout-minutes: 240
    environment: qiniu-desktop-release
    env:
      VERSION: ${{ inputs.version }}
      CHANNEL: ${{ inputs.channel }}
      DIST: apps/desktop/dist-electron
      MACOS_NOTARIZE: "true"

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Go for pinned qshell
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"

      - name: Install dependencies and qshell
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          go install github.com/qiniu/qshell/v2@v2.19.10
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Initialize private release paths
        shell: bash
        run: |
          set -euo pipefail
          echo "EVIDENCE=$RUNNER_TEMP/qiniu-release-evidence.json" >> "$GITHUB_ENV"
          echo "LOCAL_VERIFICATION=$RUNNER_TEMP/macos-local-verification.json" >> "$GITHUB_ENV"
          echo "CANARY=$RUNNER_TEMP/macos-update-canary.json" >> "$GITHUB_ENV"
          echo "RELEASE_BUNDLE=$RUNNER_TEMP/qiniu-desktop-release-bundle" >> "$GITHUB_ENV"

      - name: Validate coordinates and set transient build version
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e \
            'import { assertReleaseVersion } from "./apps/desktop/scripts/qiniu-release/constants.mjs"; assertReleaseVersion(process.env.VERSION, process.env.CHANNEL)'
          VERSION="$VERSION" node <<'NODE'
          const fs = require("node:fs");
          for (const file of ["apps/app/package.json", "apps/desktop/package.json", "apps/server/package.json"]) {
            const value = JSON.parse(fs.readFileSync(file, "utf8"));
            value.version = process.env.VERSION;
            fs.writeFileSync(file, `${JSON.stringify(value, null, 2)}\n`);
          }
          NODE

      - name: Prepare private Apple credentials
        shell: bash
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_CODESIGN_CERT_P12_BASE64: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CODESIGN_CERT_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          for name in APPLE_NOTARY_API_KEY_P8_BASE64 APPLE_NOTARY_API_KEY_ID APPLE_NOTARY_API_ISSUER_ID APPLE_CODESIGN_CERT_P12_BASE64 APPLE_CODESIGN_CERT_PASSWORD; do
            if [ -z "${!name:-}" ]; then echo "Missing required Apple release secret: $name" >&2; exit 1; fi
          done
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$APPLE_NOTARY_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_NOTARY_API_ISSUER_ID" >> "$GITHUB_ENV"
          echo "CSC_LINK=$APPLE_CODESIGN_CERT_P12_BASE64" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$APPLE_CODESIGN_CERT_PASSWORD" >> "$GITHUB_ENV"

      - name: Build and notarize ZIP plus DMG
        shell: bash
        env:
          TARGET: aarch64-apple-darwin
        run: |
          set -euo pipefail
          pnpm --filter @jugglework/desktop build:electron
          pnpm --dir apps/desktop exec electron-builder \
            --config electron-builder.yml --mac dmg zip --arm64 --publish never

      - name: Notarize and finalize outer DMG
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/desktop finalize:mac-artifacts -- --version "$VERSION" --arch arm64

      - name: Generate normalized immutable manifest
        shell: bash
        run: |
          set -euo pipefail
          node apps/desktop/scripts/qiniu-release/cli.mjs plan \
            --version "$VERSION" --channel "$CHANNEL" --platform mac --arch arm64 \
            --dist "$DIST" --evidence "$EVIDENCE"

      - name: Verify exact app, containers, and notarization receipt
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/desktop verify:mac-package -- \
            --app "dist-electron/mac-arm64/JuggleWork.app" \
            --arch arm64 --version "$VERSION" \
            --zip "dist-electron/jugglework-mac-arm64-$VERSION.zip" \
            --dmg "dist-electron/jugglework-mac-arm64-$VERSION.dmg" \
            --manifest "dist-electron/qiniu-v$VERSION-latest-mac.yml" \
            --notarization-receipt "dist-electron/mac-arm64/jugglework-notarization-receipt.json" \
            --dmg-notarization-receipt "dist-electron/mac-arm64/jugglework-dmg-notarization-receipt.json" \
            --verification-output "$LOCAL_VERIFICATION"
          node -e 'const fs=require("node:fs");const v=JSON.parse(fs.readFileSync(process.env.LOCAL_VERIFICATION));if(v.releaseState!=="release")throw new Error("Stable-capable release verification was not produced")'

      - name: Create digest-bound release evidence
        shell: bash
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          node apps/desktop/scripts/qiniu-release/cli.mjs verify-local \
            --version "$VERSION" --channel "$CHANNEL" --platform mac --arch arm64 \
            --dist "$DIST" --evidence "$EVIDENCE" --commit "$commit_sha" \
            --local-verification "$LOCAL_VERIFICATION"

      - name: Authenticate qshell from masked CI secrets
        shell: bash
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${QINIU_ACCESS_KEY:-}" ] || [ -z "${QINIU_SECRET_KEY:-}" ]; then
            echo "Missing required Qiniu release secrets" >&2
            exit 1
          fi
          echo "::add-mask::$QINIU_ACCESS_KEY"
          echo "::add-mask::$QINIU_SECRET_KEY"
          qshell account "$QINIU_ACCESS_KEY" "$QINIU_SECRET_KEY" "jugglework-ci-$GITHUB_RUN_ID" --overwrite >/dev/null

      - name: Upload immutable version objects
        shell: bash
        run: |
          set -euo pipefail
          node apps/desktop/scripts/qiniu-release/cli.mjs upload-version \
            --version "$VERSION" --channel "$CHANNEL" --platform mac --arch arm64 \
            --dist "$DIST" --evidence "$EVIDENCE"

      - name: Verify immutable CDN bytes
        shell: bash
        run: |
          set -euo pipefail
          node apps/desktop/scripts/qiniu-release/cli.mjs verify-cdn \
            --version "$VERSION" --channel "$CHANNEL" --platform mac --arch arm64 \
            --dist "$DIST" --evidence "$EVIDENCE"

      - name: Record machine canary
        if: inputs.promote
        shell: bash
        env:
          CANARY_JSON: ${{ inputs.canary_json }}
        run: |
          set -euo pipefail
          if [ -z "${CANARY_JSON:-}" ]; then echo "promote=true requires canary_json" >&2; exit 1; fi
          node -e 'const fs=require("node:fs");const value=JSON.parse(process.env.CANARY_JSON);fs.writeFileSync(process.env.CANARY,`${JSON.stringify(value,null,2)}\n`,{mode:0o600,flag:"wx"})'
          node apps/desktop/scripts/qiniu-release/cli.mjs verify-only \
            --version "$VERSION" --channel "$CHANNEL" --platform mac --arch arm64 \
            --dist "$DIST" --evidence "$EVIDENCE" --canary "$CANARY"

      - name: Promote serialized Qiniu channel
        if: inputs.promote
        shell: bash
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
        run: |
          set -euo pipefail
          node apps/desktop/scripts/qiniu-release/cli.mjs promote-channel \
            --version "$VERSION" --channel "$CHANNEL" --platform mac --arch arm64 \
            --dist "$DIST" --evidence "$EVIDENCE" --actor "github-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Stage exact release bytes and non-secret evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          release_bundle="${RELEASE_BUNDLE:-$RUNNER_TEMP/qiniu-desktop-release-bundle}"
          evidence="${EVIDENCE:-$RUNNER_TEMP/qiniu-release-evidence.json}"
          local_verification="${LOCAL_VERIFICATION:-$RUNNER_TEMP/macos-local-verification.json}"
          mkdir -p "$release_bundle"
          for source in \
            "$evidence" \
            "$local_verification" \
            "$DIST/qiniu-v$VERSION-latest-mac.yml" \
            "$DIST/jugglework-mac-arm64-$VERSION.zip" \
            "$DIST/jugglework-mac-arm64-$VERSION.zip.blockmap" \
            "$DIST/jugglework-mac-arm64-$VERSION.dmg" \
            "$DIST/jugglework-mac-arm64-$VERSION.dmg.blockmap"; do
            if [ -f "$source" ]; then cp "$source" "$release_bundle/"; fi
          done

      - name: Retain exact release bundle and non-secret evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qiniu-desktop-${{ inputs.channel }}-${{ inputs.version }}-${{ github.run_id }}
          path: ${{ runner.temp }}/qiniu-desktop-release-bundle/
          if-no-files-found: warn
          retention-days: 90

  resolve-windows-source:
    name: Resolve exact Windows release source
    if: inputs.platform == 'windows'
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Pin source commit for every Windows runner
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.channel }}" != "stable" ]; then
            echo "The current Windows package verifier requires the stable/windows updater feed." >&2
            exit 1
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build and sign Windows ${{ matrix.arch }}
    needs: resolve-windows-source
    if: inputs.platform == 'windows'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    environment: qiniu-desktop-release
    env:
      VERSION: ${{ inputs.version }}
      ARCH: ${{ matrix.arch }}
      JUGGLEWORK_WINDOWS_PUBLISHER_NAMES: ${{ inputs.windows_publisher_names || vars.JUGGLEWORK_WINDOWS_PUBLISHER_NAMES }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID || vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG || vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG || vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            builder_arg: --arm64
          - arch: x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            builder_arg: --x64

    steps:
      - name: Checkout pinned release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-windows-source.outputs.commit }}
          fetch-depth: 0

      - name: Enable git long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require SignPath and publisher configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $required = @(
            "SIGNPATH_API_TOKEN",
            "SIGNPATH_ORGANIZATION_ID",
            "SIGNPATH_PROJECT_SLUG",
            "SIGNPATH_SIGNING_POLICY_SLUG",
            "JUGGLEWORK_WINDOWS_PUBLISHER_NAMES"
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) {
            throw "Missing required Windows signing configuration: $($missing -join ', ')"
          }

      - name: Set transient build version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --input-type=module -e 'import { assertReleaseVersion, assertWindowsReleaseVersion } from "./apps/desktop/scripts/qiniu-release/constants.mjs"; assertReleaseVersion(process.env.VERSION, "${{ inputs.channel }}"); assertWindowsReleaseVersion(process.env.VERSION)'
          node -e 'const fs=require("node:fs"); for (const file of ["apps/app/package.json", "apps/desktop/package.json", "apps/server/package.json"]) { const value=JSON.parse(fs.readFileSync(file,"utf8")); value.version=process.env.VERSION; fs.writeFileSync(file, JSON.stringify(value,null,2)+"\n"); }'

      - name: Build Windows application
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: pnpm --filter @jugglework/desktop build:electron

      - name: Package unsigned Windows installer
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --win ${{ matrix.builder_arg }} --publish never

      - name: Stage unsigned installer for mandatory SignPath signing
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $unsigned = Join-Path $env:RUNNER_TEMP "signpath-unsigned"
          New-Item -ItemType Directory -Path $unsigned | Out-Null
          $installers = @(Get-ChildItem -LiteralPath "apps/desktop/dist-electron" -File -Filter "jugglework-win-$env:ARCH-$env:VERSION.exe")
          if ($installers.Count -ne 1) { throw "Expected exactly one unsigned $env:ARCH installer, found $($installers.Count)" }
          Copy-Item -LiteralPath $installers[0].FullName -Destination $unsigned

      - name: Upload unsigned installer for SignPath
        id: upload-unsigned-windows-installer
        uses: actions/upload-artifact@v4
        with:
          name: signpath-unsigned-windows-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signpath-unsigned/*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Submit mandatory SignPath signing request
        if: env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG == ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-windows-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signpath-signed

      - name: Submit mandatory SignPath signing request with artifact configuration
        if: env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-windows-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signpath-signed

      - name: Apply signed installer and regenerate updater metadata
        shell: pwsh
        run: node scripts/release/apply-signpath-windows-artifact.mjs "$env:RUNNER_TEMP/signpath-signed" apps/desktop/dist-electron

      - name: Stage exact signed architecture output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Resolve-Path "apps/desktop/dist-electron"
          $stage = Join-Path $env:RUNNER_TEMP "windows-release-$env:ARCH"
          New-Item -ItemType Directory -Path $stage | Out-Null

          $installer = Join-Path $dist "jugglework-win-$env:ARCH-$env:VERSION.exe"
          $blockmap = "$installer.blockmap"
          $manifest = Join-Path $dist "latest.yml"
          foreach ($file in @($installer, $blockmap, $manifest)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing signed Windows release output: $file" }
            Copy-Item -LiteralPath $file -Destination $stage
          }

          $packaged = @(Get-ChildItem -LiteralPath $dist -Directory | Where-Object {
            Test-Path -LiteralPath (Join-Path $_.FullName "resources/app-update.yml") -PathType Leaf
          })
          if ($packaged.Count -ne 1) { throw "Expected exactly one packaged $env:ARCH directory containing resources/app-update.yml, found $($packaged.Count)" }
          Copy-Item -LiteralPath $packaged[0].FullName -Destination (Join-Path $stage "packaged") -Recurse

      - name: Upload final signed architecture output
        uses: actions/upload-artifact@v4
        with:
          name: qiniu-windows-signed-${{ matrix.arch }}-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-release-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 30

  aggregate-windows:
    name: Verify, publish, and retain signed Windows release
    needs:
      - resolve-windows-source
      - build-windows
    if: inputs.platform == 'windows'
    runs-on: windows-2022
    timeout-minutes: 180
    environment: qiniu-desktop-release
    env:
      VERSION: ${{ inputs.version }}
      CHANNEL: ${{ inputs.channel }}
      DIST: apps/desktop/dist-electron
      JUGGLEWORK_WINDOWS_PUBLISHER_NAMES: ${{ inputs.windows_publisher_names || vars.JUGGLEWORK_WINDOWS_PUBLISHER_NAMES }}

    steps:
      - name: Checkout pinned release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-windows-source.outputs.commit }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Go for pinned qshell
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"

      - name: Install dependencies and qshell
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pnpm install --frozen-lockfile
          go install github.com/qiniu/qshell/v2@v2.19.10
          (Join-Path (go env GOPATH) "bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Require Windows publisher allowlist
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:JUGGLEWORK_WINDOWS_PUBLISHER_NAMES)) {
            throw "JUGGLEWORK_WINDOWS_PUBLISHER_NAMES must be supplied by the workflow input or protected environment variables"
          }

      - name: Initialize private release paths
        shell: pwsh
        run: |
          "EVIDENCE=$env:RUNNER_TEMP/qiniu-windows-release-evidence.json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOCAL_VERIFICATION=$env:RUNNER_TEMP/windows-local-verification.json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CANARY=$env:RUNNER_TEMP/windows-update-canary.json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_BUNDLE=$env:RUNNER_TEMP/qiniu-windows-release-bundle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download signed arm64 bytes
        uses: actions/download-artifact@v5
        with:
          name: qiniu-windows-signed-arm64-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/desktop/dist-electron/arm64

      - name: Download signed x64 bytes
        uses: actions/download-artifact@v5
        with:
          name: qiniu-windows-signed-x64-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/desktop/dist-electron/x64

      - name: Locate Windows SDK signtool
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $signTool = @(where.exe signtool.exe 2>$null | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf }) | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($signTool)) {
            $targetArch = switch ($env:PROCESSOR_ARCHITECTURE) {
              "ARM64" { "arm64" }
              "x86" { "x86" }
              default { "x64" }
            }
            $sdkBin = Join-Path ${env:ProgramFiles(x86)} "Windows Kits/10/bin"
            $signTool = Get-ChildItem -LiteralPath $sdkBin -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              $sdkVersion = $null
              $candidate = Join-Path $_.FullName "$targetArch/signtool.exe"
              if ([version]::TryParse($_.Name, [ref]$sdkVersion) -and (Test-Path -LiteralPath $candidate -PathType Leaf)) {
                [pscustomobject]@{ Version = $sdkVersion; Path = $candidate }
              }
            } | Sort-Object Version -Descending | Select-Object -First 1 -ExpandProperty Path
          }
          if ([string]::IsNullOrWhiteSpace($signTool)) { throw "Could not locate Windows SDK signtool.exe for $env:PROCESSOR_ARCHITECTURE" }
          "JUGGLEWORK_SIGNTOOL=$signTool" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate normalized immutable Windows manifest
        shell: pwsh
        run: |
          node apps/desktop/scripts/qiniu-release/cli.mjs plan `
            --version "$env:VERSION" --channel "$env:CHANNEL" --platform windows --arch arm64,x64 `
            --dist "$env:DIST" --evidence "$env:EVIDENCE"

      - name: Verify both signed Windows packages and post-sign blockmaps
        shell: pwsh
        run: |
          pnpm --dir apps/desktop verify:windows-package -- `
            --version "$env:VERSION" --staging-root "dist-electron" `
            --manifest "dist-electron/qiniu-v$env:VERSION-latest.yml" `
            --verification-output "$env:LOCAL_VERIFICATION"

      - name: Create digest-bound Windows release evidence
        shell: pwsh
        run: |
          node apps/desktop/scripts/qiniu-release/cli.mjs verify-local `
            --version "$env:VERSION" --channel "$env:CHANNEL" --platform windows --arch arm64,x64 `
            --dist "$env:DIST" --evidence "$env:EVIDENCE" `
            --commit "${{ needs.resolve-windows-source.outputs.commit }}" --local-verification "$env:LOCAL_VERIFICATION"

      - name: Authenticate qshell from masked CI secrets
        shell: pwsh
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:QINIU_ACCESS_KEY) -or [string]::IsNullOrWhiteSpace($env:QINIU_SECRET_KEY)) {
            throw "Missing required Qiniu release secrets"
          }
          Write-Output "::add-mask::$env:QINIU_ACCESS_KEY"
          Write-Output "::add-mask::$env:QINIU_SECRET_KEY"
          qshell account $env:QINIU_ACCESS_KEY $env:QINIU_SECRET_KEY "jugglework-ci-$env:GITHUB_RUN_ID" --overwrite | Out-Null

      - name: Upload immutable signed Windows objects
        shell: pwsh
        run: |
          node apps/desktop/scripts/qiniu-release/cli.mjs upload-version `
            --version "$env:VERSION" --channel "$env:CHANNEL" --platform windows --arch arm64,x64 `
            --dist "$env:DIST" --evidence "$env:EVIDENCE"

      - name: Verify immutable Windows CDN bytes
        shell: pwsh
        run: |
          node apps/desktop/scripts/qiniu-release/cli.mjs verify-cdn `
            --version "$env:VERSION" --channel "$env:CHANNEL" --platform windows --arch arm64,x64 `
            --dist "$env:DIST" --evidence "$env:EVIDENCE"

      - name: Validate canary and re-verify immutable signed bytes
        if: inputs.promote
        shell: pwsh
        env:
          CANARY_JSON: ${{ inputs.canary_json }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:CANARY_JSON)) { throw "promote=true requires canary_json" }
          $value = $env:CANARY_JSON | ConvertFrom-Json
          $value | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $env:CANARY -Encoding utf8NoBOM
          node apps/desktop/scripts/qiniu-release/cli.mjs verify-only `
            --version "$env:VERSION" --channel "$env:CHANNEL" --platform windows --arch arm64,x64 `
            --dist "$env:DIST" --evidence "$env:EVIDENCE" --canary "$env:CANARY"

      - name: Promote serialized Windows Qiniu channel
        if: inputs.promote
        shell: pwsh
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
        run: |
          node apps/desktop/scripts/qiniu-release/cli.mjs promote-channel `
            --version "$env:VERSION" --channel "$env:CHANNEL" --platform windows --arch arm64,x64 `
            --dist "$env:DIST" --evidence "$env:EVIDENCE" --actor "github-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"

      - name: Stage signed release bundle and non-secret evidence
        if: always()
        shell: pwsh
        run: |
          $bundle = $env:RELEASE_BUNDLE
          if ([string]::IsNullOrWhiteSpace($bundle)) { $bundle = Join-Path $env:RUNNER_TEMP "qiniu-windows-release-bundle" }
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          foreach ($arch in @("arm64", "x64")) {
            $destination = Join-Path $bundle $arch
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
            foreach ($name in @("jugglework-win-$arch-$env:VERSION.exe", "jugglework-win-$arch-$env:VERSION.exe.blockmap", "latest.yml")) {
              $source = Join-Path $env:DIST "$arch/$name"
              if (Test-Path -LiteralPath $source -PathType Leaf) { Copy-Item -LiteralPath $source -Destination $destination }
            }
          }
          foreach ($source in @(
            $env:EVIDENCE,
            $env:LOCAL_VERIFICATION,
            (Join-Path $env:DIST "qiniu-v$env:VERSION-latest.yml")
          )) {
            if (-not [string]::IsNullOrWhiteSpace($source) -and (Test-Path -LiteralPath $source -PathType Leaf)) {
              Copy-Item -LiteralPath $source -Destination $bundle
            }
          }

      - name: Retain exact signed Windows bundle and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qiniu-desktop-windows-${{ inputs.channel }}-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qiniu-windows-release-bundle/
          if-no-files-found: warn
          retention-days: 90
