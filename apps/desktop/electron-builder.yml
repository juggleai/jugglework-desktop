# Stable JuggleWork bundle identifier for macOS keychain entries, Launchpad,
# TCC permissions, and the packaged desktop application.
appId: com.juggleai.jugglework
productName: JuggleWork
protocols:
  - name: JuggleWork
    schemes:
      - jugglework
directories:
  output: dist-electron
toolsets:
  appimage: "1.0.3"
files:
  - electron/**/*
  - "!electron/**/*.test.mjs"
  - dist/runtime/**/*
  - server/**/*
  - "!server/dist/opencode-plugins/**"
  - "!node_modules/@jugglework/types/src/**"
  - "!node_modules/.pnpm/@jugglework+types*/node_modules/@jugglework/types/src/**"
  - package.json
extraResources:
  - from: ../app/dist
    to: app-dist
  - from: resources/skills
    to: skills
  - from: server/dist/opencode-plugins
    to: opencode-plugins
    filter:
      - "*.js"
  - from: ../../packages/docs
    to: jugglework-docs
    filter:
      - "**/*.md"
      - "**/*.mdx"
      - "docs.json"
  - from: resources/jugglework-ui-mcp
    to: jugglework-ui-mcp
    filter:
      - index.mjs
asar: true
asarUnpack:
  - node_modules/.pnpm/@lydell+node-pty*/**
  - node_modules/node-pty/**
npmRebuild: true
afterPack: scripts/electron-after-pack.cjs
afterSign: scripts/electron-after-sign.cjs
# electron-updater feed for JuggleWork desktop releases.
publish:
  - provider: github
    owner: juggleai
    repo: jugglework-desktop
    releaseType: release
mac:
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools
  minimumSystemVersion: "14.0"
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: JuggleWork uses the microphone when you start Voice Mode so you can speak commands to your agent.
    NSScreenCaptureUsageDescription: JuggleWork uses screen recording only when you ask Computer Use to inspect or interact with your screen.
  extraResources:
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode
        - opencode-aarch64-apple-darwin
        - opencode-x86_64-apple-darwin
        - versions.json
        - versions.json-aarch64-apple-darwin
        - versions.json-x86_64-apple-darwin
    - from: resources/helpers
      to: helpers
      filter:
        - "JuggleWork Computer Use.app/**"
  target:
    - dmg
    - zip
linux:
  icon: resources/icons/icon.png
  executableName: jugglework
  extraResources:
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode
        - opencode-aarch64-unknown-linux-gnu
        - opencode-x86_64-unknown-linux-gnu
        - versions.json
        - versions.json-aarch64-unknown-linux-gnu
        - versions.json-x86_64-unknown-linux-gnu
  target:
    - AppImage
    - tar.gz
win:
  icon: resources/icons/icon.ico
  extraResources:
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode.exe
        - opencode-aarch64-pc-windows-msvc.exe
        - opencode-x86_64-pc-windows-msvc.exe
        - versions.json
        - versions.json-aarch64-pc-windows-msvc.exe
        - versions.json-x86_64-pc-windows-msvc.exe
  target:
    - nsis
nsis:
  include: build/installer.nsh
artifactName: jugglework-${os}-${arch}-${version}.${ext}
