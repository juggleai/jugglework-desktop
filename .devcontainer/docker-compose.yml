# Desktop development environment for Daytona, Codespaces, and devcontainers.
#
# Runs the real Electron app with a virtual display accessible through noVNC.

services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    ports:
      - "5173:5173"
      - "6080:6080"
      - "9825:9825"
    environment:
      DISPLAY: ":99"
      ELECTRON_DISABLE_SANDBOX: "1"
      OPENWORK_ELECTRON_REMOTE_DEBUG_PORT: "9825"
      OPENWORK_DEV_MODE: "1"
    command: sleep infinity
