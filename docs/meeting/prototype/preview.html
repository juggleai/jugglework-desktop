function mini(){return `<div class="mini-calendar"><div class="row between"><strong>2026 年 11 月</strong><span class="sub">‹　›</span></div><div class="mini-grid">${['一','二','三','四','五','六','日'].map(d=>`<span class="sub">${d}</span>`).join('')}${Array.from({length:42},(_,i)=>{let d=i-5;return `<span class="${d===6?'today':''} ${d<1||d>30?'sub':''}">${d<1?31+d:d>30?d-30:d}</span>`}).join('')}</div></div>`}
function shell(){return `<div class="shell"><aside class="rail"><div class="brand">J</div>${[['home','home','工作台'],['chat','chat','消息'],['contacts','users','通讯'],['home','video','会议']].map(([a,i,t],idx)=>`<button data-action="${a}" class="${idx===3&&state.page!=='chat'?'active':idx===1&&state.page==='chat'?'active':''}" title="${t}">${icon(i)}${t}</button>`).join('')}<div class="rail-bottom">${btn('', 'theme','icon','moon')}${avatar(people[0])}</div></aside><div class="workspace"><header class="topbar"><div class="row"><strong>${state.page==='chat'?'消息':'会议'}</strong><span class="prototype-label">设计预览 · V1</span></div><div class="tabs">${[['home','首页'],['calendar','日历'],['history','历史会议']].map(([a,t])=>btn(t,a,state.page===a?'selected':'')).join('')}</div><div class="row">${state.active?btn('返回会议','return','ghost small','video'):''}${btn('','settings','icon ghost','settings')}</div></header><main class="content">${state.page==='home'?home():state.page==='calendar'?calendar():state.page==='chat'?chat():history()}</main></div></div>`}
function home(){return `<div class="welcome row between"><div><div class="eyebrow">MEET, CONNECT, CREATE</div><h1>让想法，在这里相遇。</h1><p class="sub">早上好，知远。今天有 ${meetings.length} 场会议，预留一点时间给交流。</p></div><span class="pill">2026 年 11 月 6 日 · 周五</span></div><div class="actions">${[['快速会议','即刻开始，让讨论发生','quick','video'],['加入会议','通过会议号或链接加入','join','plus'],['预约会议','为下一次交流留出时间','schedule','calendar']].map(([t,d,a,i])=>`<button class="action" data-action="${a}"><span>${icon(i)}</span><span><h3>${t}</h3><div class="small">${d}</div></span></button>`).join('')}</div><div class="dashboard"><section><div class="row between section-head"><h2>今日安排 <span class="sub small">　${meetings.length} 场会议</span></h2>${btn('查看日历','calendar','ghost small','arrow')}</div>${meetings.map((m,i)=>`<div class="meeting-item"><div class="time">${m.time}<small>${m.end}</small></div><div class="meeting-body"><div class="row"><h3>${esc(m.title)}</h3>${m.live&&!state.ended?'<span class="pill live"><i class="dot"></i>进行中</span>':''}</div><div class="meta">${icon(m.source.includes('组')?'users':'calendar')} ${esc(m.source)}</div>${faces()}</div>${btn(m.live&&!state.ended?'加入会议':'查看详情',m.live&&!state.ended?`preview:${i}`:`detail:${i}`,m.live&&!state.ended?'primary':'')}</div>`).join('')}</section><aside>${mini()}<div class="tip"><h3>每一场讨论，都有一个入口</h3>从群聊发起会议，成员随时加入。<br>也可以从单聊开始，邀请更多伙伴。${btn('体验群聊入口','chat','ghost small','arrow')}</div></aside></div><div class="review-note"><span>原型中的会议、成员和设备状态均为演示数据</span><span>JuggleWork Meetings · 01</span></div>`}
function calendar(){return `<div class="row between"><div><div class="eyebrow">YOUR TIME, TOGETHER</div><h1>会议日历</h1><p class="sub" style="margin-top:8px">让今天有条不紊，让下一次见面有所准备。</p></div>${btn('预约会议','schedule','primary','plus')}</div><div class="row between calendar-toolbar"><div class="row"><h2>2026 年 11 月</h2>${btn('今天','today','small')}</div><div class="row"><span class="small sub">我的会议</span><div class="segmented">${[['day','日'],['week','周'],['month','月']].map(([v,t])=>btn(t,`cal:${v}`,state.calendar===v?'selected':'')).join('')}</div></div></div>${state.calendar==='month'?`<div class="calendar">${['周一','周二','周三','周四','周五','周六','周日'].map(d=>`<div class="cal-day cal-head">${d}</div>`).join('')}${Array.from({length:42},(_,i)=>{let d=i-5;return `<div class="cal-day ${d===6?'today':''}"><span class="${d<1||d>30?'sub':''}">${d<1?31+d:d>30?d-30:d}${d===6?' · 今天':''}</span>${d===6?meetings.map((m,j)=>`<button class="cal-event ${j===1?'green':''}" data-action="detail:${j}">${m.time} ${esc(m.title)}</button>`).join(''):d===10||d===17||d===24?'<span class="pill">暂无安排</span>':''}</div>`}).join('')}</div>`:state.calendar==='day'?`<h3 style="margin:20px 0">11 月 6 日 · 周五</h3>${meetings.map((m,i)=>`<div class="meeting-item"><div class="time">${m.time}<small>${m.end}</small></div><div class="meeting-body"><h3>${esc(m.title)}</h3><span class="sub small">${esc(m.source)}</span></div>${btn('查看详情',`detail:${i}`)}</div>`).join('')}`:`<div class="week"><div></div>${['周一 2','周二 3','周三 4','周四 5','周五 6'].map(d=>`<div>${d}</div>`).join('')}${[9,10,11,12,13,14,15,16].map(h=>`<div class="sub">${h}:00</div>${Array.from({length:5},(_,i)=>`<div>${i===4?meetings.map((m,j)=>parseInt(m.time)===h?`<button class="cal-event" data-action="detail:${j}">${esc(m.title)}</button>`:'').join(''):''}</div>`).join('')}`).join('')}</div>`}`}
function history(){return `<div class="eyebrow">GOOD CONVERSATIONS STAY</div><h1>历史会议</h1><p class="sub" style="margin:10px 0 30px">回顾参与过的讨论。</p>${['11 月 5 日','11 月 4 日'].map((d,i)=>`<div class="meeting-item"><span class="sub">${d}</span><div class="meeting-body"><h3>${i?'设计系统交流':'产品迭代周会'}</h3><span class="sub small">${i?'32':'46'} 分钟 · ${i?'4':'6'} 人参加</span></div><span class="pill">已结束</span>${btn('查看记录',`past:${i}`)}</div>`).join('')}`}
function chat(){let group=state.thread==='group';return `<div class="row between"><h2>团队沟通</h2><span class="sub small">从一次讨论，开始一场会议</span></div><div class="chat-layout"><div class="chat-sidebar"><div class="row sub small" style="padding:12px">${icon('search')} 搜索消息</div><div class="chat-thread ${group?'active':''}" data-action="thread:group">产品设计组 <small>林知远发起了会议</small></div><div class="chat-thread ${!group?'active':''}" data-action="thread:direct">陈思齐 <small>一起看一下新的会议方案？</small></div></div><div class="chat-conv"><div class="chat-conv-head row between"><div><h3>${group?'产品设计组':'陈思齐'}</h3><span class="sub small">${group?'12 位成员':'同组织成员'}</span></div>${btn('发起会议','quick','ghost small','video')}</div>${!state.ended?`<div class="chat-banner row between"><span>${icon('video')} 产品体验设计评审正在进行 · 4 人</span>${btn('加入','preview:0','small')}</div>`:''}<div class="chat-feed"><div class="row">${avatar(people[1])}<span class="sub small">陈思齐　10:28</span></div><div class="bubble" style="width:fit-content;margin:10px 0 25px 44px">一起看一下新的会议方案？</div><div class="row">${avatar(people[0])}<span class="sub small">林知远　10:30</span></div><div class="meeting-card" style="margin-left:44px"><span class="small sub">${icon('video')} 音视频会议</span><h3>产品体验设计评审</h3><span class="pill ${state.ended?'':'live'}">${state.ended?'已结束':'正在进行 · 4 人已加入'}</span><p class="sub small" style="margin-top:12px">${group?'群成员可直接加入会议':'加入后可以继续邀请其他同事'}</p>${btn(state.ended?'查看详情':'加入会议',state.ended?'detail:0':'preview:0','primary')}</div></div><div class="chat-composer sub small">消息区仅作入口示意 · 点击上方「发起会议」体验流程</div></div></div>`}
function room(){return `<div class="room"><header class="room-top"><div class="row">${btn('','minimize','icon ghost','chevron')}<strong>${esc(state.title)}</strong><span class="pill live"><i class="dot"></i>会议中</span><span class="sub small">08:24</span></div><div class="row"><span class="prototype-label">模拟会议 · 不采集设备</span>${btn(state.layout==='grid'?'宫格布局':'演讲者', 'layout','ghost small','grid')}${btn('','settings','icon ghost','settings')}</div></header><div class="room-main"><div class="stage ${!state.share&&state.layout==='speaker'?'speaker':''}">${state.share?`<div class="share-stage"><div class="shared-doc"><span class="small" style="letter-spacing:3px">JUGGLEWORK / DESIGN REVIEW</span><h1>让协作自然发生。</h1><p>会议体验设计 · 第一版方案</p><div class="line" style="width:80%;margin-top:30px"></div><div class="line" style="width:60%"></div><div class="bar-chart">${[35,56,47,76,90].map(h=>`<span style="height:${h}%"></span>`).join('')}</div><p class="small" style="margin-top:24px;color:#7a879a">正在展示模拟共享内容</p></div><div class="thumbs">${people.slice(0,3).map(tile).join('')}</div></div>`:people.map(tile).join('')}</div>${state.panel?panel():''}</div><footer class="room-bottom"><span class="sub small">${icon('link')} 会议号 836 219 045</span><div class="controls">${btn(state.mic?'静音':'解除静音','mic',`control ${state.mic?'':'off'}`,state.mic?'mic':'micoff')}${btn(state.cam?'关闭视频':'开启视频','cam',`control ${state.cam?'':'off'}`,state.cam?'video':'cameraoff')}${btn(state.share?'停止共享':'共享屏幕','share',`control ${state.share?'on':''}`,'screen')}${btn('邀请','invite','control','plus')}${btn('成员 (4)','panel:members',`control ${state.panel==='members'?'on':''}`,'users')}${btn('聊天','panel:chat',`control ${state.panel==='chat'?'on':''}`,'chat')}${btn(state.hand?'放下手':'举手','hand',`control ${state.hand?'on':''}`,'hand')}</div>${btn('离开','leave','danger','phone')}</footer></div>`}
function tile(p,i){return `<div class="tile ${i===1?'speaking':''}">${avatar(p)}${i===1?'<span class="tile-tag">▂ ▄ ▆ 正在讲话</span>':''}<div class="tile-label">${icon(i===0&&state.mic||i===1?'mic':'micoff')}${p[1]}${i===0?'（我）':''}${i===0&&state.hand?' · 已举手':''}${i===0&&state.cam?' · 视频模拟':''}</div></div>`}
function panel(){return `<aside class="room-panel"><div class="row between"><h3>${state.panel==='members'?'参会成员 (4)':'会议聊天'}</h3>${btn('','panel:close','icon ghost','close')}</div>${state.panel==='members'?`<input placeholder="搜索成员" aria-label="搜索成员" id="member-search"><div id="member-list">${people.map(person).join('')}</div><div class="sub small" style="margin-top:auto;line-height:1.8">会议内的聊天与原会话独立。<br>邀请同事，一起加入讨论。</div>${btn('邀请参会','invite','','plus')}${btn('全员静音','muteall','small ghost')}`:`<p class="sub small">仅本会议成员可见</p><div class="chat-list">${messages.map(m=>`<div class="chat-msg"><small>${esc(m[0])}　${m[1]}</small><div class="bubble">${esc(m[2])}</div></div>`).join('')}</div><form class="chat-input" id="chat-form"><input name="message" aria-label="会议消息" placeholder="发送消息…" autocomplete="off" required>${btn('','sendchat','primary icon','arrow')}</form>`}</aside>`}
function person(p){return `<div class="person">${avatar(p)}<div class="name">${p[1]}<small>${p[3]}</small></div>${icon('micoff')}</div>`}
function render(){document.querySelector('#app').innerHTML=state.room?room():shell()}
let lastFocus;
function modal(title,body,foot='',wide=false){lastFocus=document.activeElement;document.querySelector('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="modal-head"><h2>${title}</h2>${btn('','close','ghost icon','close')}</header>${body}${foot?`<footer class="modal-foot">${foot}</footer>`:''}</section></div>`;document.querySelector('.modal input,.modal button')?.focus()}
function close(){document.querySelector('#modal-root').innerHTML='';lastFocus?.focus()}
let toastTimer;function toast(t){let el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3000)}
function preview(title){state.title=title||'产品体验设计评审';modal('加入会议',`<p class="sub small" style="margin:-12px 0 17px">${esc(state.title)} · 林知远主持</p><div class="preview">${avatar(people[0])}<span class="preview-caption">${state.cam?'摄像头已开启（模拟画面）':'摄像头已关闭'}</span></div><div class="device-controls">${btn(state.mic?'麦克风已开启':'麦克风已关闭','previewmic','',state.mic?'mic':'micoff')}${btn(state.cam?'摄像头已开启':'摄像头已关闭','previewcam','',state.cam?'video':'cameraoff')}${btn('设备设置','devices','','settings')}</div><p class="small sub" style="margin-top:16px">设备操作仅作演示，不会请求系统权限。</p>`,btn('取消','close')+btn('加入会议','enter','primary'),true)}
function schedule(){modal('预约会议',`<form id="schedule-form" class="fields"><label class="full">会议主题<input name="title" placeholder="为这次讨论起个名字" required maxlength="80"></label><label>开始时间<input type="datetime-local" name="start" value="2026-11-06T14:00" required></label><label>结束时间<input type="datetime-local" name="end" value="2026-11-06T14:30" required></label><label class="full">邀请参会人<select name="invite"><option>产品设计组（12 人）</option><option>陈思齐、周子衡</option><option>稍后邀请</option></select></label><label class="full">会议说明<textarea name="description" rows="2" placeholder="写下讨论主题，让大家提前准备"></textarea></label><div class="full row between"><span class="sub small">时区：Asia/Shanghai</span><label class="check"><input type="checkbox" checked>提前 10 分钟提醒</label></div><footer class="modal-foot full">${btn('取消','close')}<button class="primary" type="submit">创建会议</button></footer></form>`,'',true)}
function detail(i){let m=meetings[i];modal('会议详情',`<h2>${esc(m.title)}</h2><div class="stack" style="margin-top:25px"><div class="row sub">${icon('calendar')}2026 年 11 月 6 日　${m.time} – ${m.end}</div><div class="row sub">${icon('users')}${esc(m.source)}</div><div class="row sub">${icon('link')}836 219 045</div>${faces()}<p class="small sub">${m.live&&!state.ended?'会议正在进行，随时可以加入。':state.ended&&i===0?'这场会议已结束。':'提前 10 分钟提醒 · 等待主持人开始会议。'}</p></div>`,btn('复制邀请','copy')+btn(m.live&&!state.ended?'加入会议':'关闭',m.live&&!state.ended?`preview:${i}`:'close','primary'))}
function settings(){modal('会议设置',`<div class="stack"><div class="row between"><span>外观</span>${btn(document.body.classList.contains('dark')?'切换浅色':'切换深色','theme','','moon')}</div><label>音频输入<select><option>与系统一致 · 默认麦克风</option><option>外接麦克风（演示）</option></select></label><label>音频输出<select><option>与系统一致 · 默认扬声器</option></select></label><div style="border-top:1px solid var(--line);padding-top:17px"><h3>ZEGO 接入配置</h3><p class="sub small" style="margin:8px 0 12px">已预留 AppID 配置。你提供后，在正式开发阶段接入。</p><input readonly aria-label="ZEGO AppID 配置状态" value="${window.MEETING_CONFIG.zego.appId||'AppID 待提供'}"><p class="sub small" style="margin-top:10px">当前为 UI 演示，无真实音视频连接。</p></div></div>`,btn('完成','close','primary'))}
async function action(a){const [type,arg]=a.split(':');if(['home','calendar','history','chat'].includes(type)){state.page=type;state.room=false;render();return}switch(type){case'contacts':toast('通讯录入口示意，会议可通过「邀请」选择成员');break;case'theme':document.body.classList.toggle('dark');break;case'settings':settings();break;case'close':close();break;case'quick':preview('林知远的即时会议');break;case'preview':preview(meetings[arg]?.title);break;case'previewmic':state.mic=!state.mic;preview(state.title);break;case'previewcam':state.cam=!state.cam;preview(state.title);break;case'devices':modal('设备设置',`<div class="stack"><label>麦克风<select><option>系统默认麦克风</option></select></label><label>摄像头<select><option>系统默认摄像头</option></select></label><p class="sub small">此处为设备选择样式预览，不读取实际设备。</p></div>`,btn('返回预览','backpreview','primary'));break;case'backpreview':preview(state.title);break;case'join':modal('加入会议',`<form id="join-form"><label>会议号或会议链接<input name="code" placeholder="输入会议号或粘贴邀请链接" required autocomplete="off"></label><p class="sub small" style="margin-top:12px">原型可输入任意非空会议号体验。</p><footer class="modal-foot">${btn('取消','close')}<button class="primary" type="submit">下一步</button></footer></form>`);break;case'enter':close();state.room=true;state.active=true;state.ended=false;render();break;case'return':state.room=true;render();break;case'minimize':state.room=false;state.page='home';render();break;case'schedule':schedule();break;case'detail':detail(Number(arg));break;case'cal':state.calendar=arg;render();break;case'today':toast('已定位到 2026 年 11 月 6 日');break;case'past':modal('历史会议',`<h2>${arg==='0'?'产品迭代周会':'设计系统交流'}</h2><p class="sub" style="margin:18px 0">会议已结束 · ${arg==='0'?'46':'32'} 分钟</p>${faces()}<p class="sub small" style="margin-top:20px">本次未开启录制，暂无会议纪要。</p>`,btn('关闭','close'));break;case'thread':state.thread=arg;render();break;case'layout':state.layout=state.layout==='grid'?'speaker':'grid';render();break;case'mic':state.mic=!state.mic;render();break;case'cam':state.cam=!state.cam;render();toast('视频状态已切换，原型使用头像代替真实画面');break;case'hand':state.hand=!state.hand;render();break;case'panel':state.panel=arg==='close'||state.panel===arg?'':arg;render();break;case'invite':modal('邀请参会',`<p class="sub small" style="margin-bottom:18px">选择同组织成员加入当前会议</p><div class="stack">${[['苏','苏予安','mint'],['唐','唐文清','peach'],['陆','陆景行','lilac']].map(p=>`<label class="check"> <input type="checkbox" name="invite-person" value="${p[1]}">${avatar(p)}${p[1]}</label>`).join('')}</div><p class="sub small" style="margin-top:20px">受邀者将收到会议邀请和呼叫提示。</p>`,btn('复制会议邀请','copy')+btn('发送邀请','sendinvite','primary'));break;case'sendinvite':{let names=[...document.querySelectorAll('[name="invite-person"]:checked')].map(e=>e.value);if(!names.length){toast('请先选择参会人');break}close();toast(`已模拟邀请 ${names.join('、')}`);break}case'copy':{let text='邀请加入「'+state.title+'」，会议号：836 219 045（设计演示）';try{await navigator.clipboard.writeText(text);toast('邀请内容已复制')}catch{toast('当前预览环境不支持复制，会议号：836 219 045')}break}case'muteall':state.mic=false;render();toast('已模拟全员静音');break;case'share':if(state.share){state.share=false;render()}else modal('共享屏幕',`<p class="sub small" style="margin-bottom:17px">选择你想展示的内容 · 模拟来源</p><div class="source-grid"><button class="source selected" data-action="source">${icon('screen')}整个屏幕</button><button class="source" data-action="source">${icon('grid')}设计文档窗口</button></div><p class="sub small" style="margin-top:17px">确认后展示模拟内容，不会读取你的屏幕。</p>`,btn('取消','close')+btn('开始共享','startshare','primary'),true);break;case'source':break;case'startshare':close();state.share=true;render();break;case'leave':modal('离开会议',`<p class="sub">你是当前主持人。可以将主持权交给陈思齐后离开，或结束所有人的会议。</p>`,btn('转交并离开','transfer')+btn('结束所有人的会议','confirmend','danger'));break;case'confirmend':modal('结束会议？',`<p class="sub">所有参会人都将离开当前会议，结束后无法再次加入。</p>`,btn('取消','close')+btn('确认结束','end','danger'));break;case'transfer':case'end':close();state.active=false;state.room=false;state.share=false;if(type==='end')state.ended=true;render();modal(type==='end'?'会议已结束':'已离开会议',`<div class="end-state"><span class="avatar mint">${icon('check')}</span><h2>${type==='end'?'感谢这次交流。':'主持权已转交给陈思齐'}</h2><p class="sub">${esc(state.title)} · 本次演示已结束</p>${btn('返回会议首页','finish','primary')}</div>`);break;case'finish':close();state.page='home';render();break;case'sendchat':break;}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='source'){document.querySelectorAll('.source').forEach(el=>el.classList.remove('selected'));b.classList.add('selected')}action(b.dataset.action)});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='join-form'){preview('产品体验设计评审')}if(e.target.id==='schedule-form'){let f=new FormData(e.target),start=String(f.get('start')),end=String(f.get('end'));if(end<=start){toast('结束时间必须晚于开始时间');return}if(start.slice(0,10)!=='2026-11-06'||end.slice(0,10)!=='2026-11-06'){toast('此版原型演示 11 月 6 日，请选择当天时间');return}meetings.push({title:String(f.get('title')),time:start.slice(11),end:end.slice(11),source:'我发起的会议',live:false});close();state.page='calendar';render();toast('预约已添加到演示日历（刷新后重置）')}if(e.target.id==='chat-form'){let f=new FormData(e.target),text=String(f.get('message')).trim();if(text){messages.push(['我','10:38',text]);render()}}});
document.addEventListener('input',e=>{if(e.target.id==='member-search'){document.querySelector('#member-list').innerHTML=people.filter(p=>p[1].includes(e.target.value)).map(person).join('')}});
document.addEventListener('keydown',e=>{let dialog=document.querySelector('.modal');if(!dialog)return;if(e.key==='Escape'){close();return}if(e.key==='Tab'){let els=[...dialog.querySelectorAll('button,input,select,textarea')].filter(el=>!el.disabled);let first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
render();
